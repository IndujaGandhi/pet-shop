<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Store building -->
  <rect x="30" y="80" width="140" height="130" fill="#D4A574" stroke="#8B6F47" stroke-width="2" rx="8"/>
  
  <!-- Roof -->
  <polygon points="30,80 100,30 170,80" fill="#5A4A2D" stroke="#3C3729" stroke-width="2"/>
  
  <!-- Roof edge -->
  <line x1="30" y1="80" x2="170" y2="80" stroke="#3C3729" stroke-width="2"/>
  
  <!-- Door -->
  <rect x="55" y="130" width="50" height="80" fill="#6B5344" stroke="#3C3C3C" stroke-width="2" rx="4"/>
  <circle cx="102" cy="170" r="4" fill="#C9A961" stroke="#8B6F47" stroke-width="1"/>
  
  <!-- Door window -->
  <rect x="65" y="140" width="30" height="25" fill="#A8D5FF" stroke="#5A7A99" stroke-width="1" rx="2"/>
  
  <!-- Main window -->
  <rect x="120" y="100" width="50" height="50" fill="#87CEEB" stroke="#4A7BA7" stroke-width="2" rx="4"/>
  
  <!-- Window panes -->
  <line x1="145" y1="100" x2="145" y2="150" stroke="#4A7BA7" stroke-width="1"/>
  <line x1="120" y1="125" x2="170" y2="125" stroke="#4A7BA7" stroke-width="1"/>
  
  <!-- Cute pet silhouettes in window -->
  <!-- Cat head -->
  <circle cx="135" cy="118" r="6" fill="#8B6F47"/>
  <polygon points="135,112 132,107 138,107" fill="#8B6F47"/>
  
  <!-- Dog head -->
  <circle cx="160" cy="138" r="7" fill="#A0714F"/>
  <ellipse cx="155" cy="140" rx="3" ry="4" fill="#A0714F"/>
  
  <!-- Ground/grass -->
  <rect x="30" y="210" width="140" height="20" fill="#10B981" rx="4"/>
  
  <!-- Some grass details -->
  <line x1="40" y1="215" x2="45" y2="210" stroke="#059669" stroke-width="1"/>
  <line x1="65" y1="215" x2="70" y2="210" stroke="#059669" stroke-width="1"/>
  <line x1="90" y1="215" x2="95" y2="210" stroke="#059669" stroke-width="1"/>
  <line x1="115" y1="215" x2="120" y2="210" stroke="#059669" stroke-width="1"/>
  <line x1="140" y1="215" x2="145" y2="210" stroke="#059669" stroke-width="1"/>
  <line x1="160" y1="215" x2="165" y2="210" stroke="#059669" stroke-width="1"/>
</svg>